<template>
  <style>
    @font-face { font-family: "Excalifont"; src: url("assets/fonts/excalifont.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; pointer-events: none; }
    .cap { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; }
    .cap span { display: inline-block; max-width: 1500px; padding: 10px 26px 12px; border-radius: 14px; background: rgba(255,255,255,0.94);
                border: 2px solid #1e1e1e; color: #1e1e1e; font-family: "Excalifont", sans-serif; font-size: 40px; line-height: 1.2; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="190.7">
    <div id="cap0" class="clip cap" data-start="0.55" data-duration="2.69"><span>Agent-Native has hundreds of GitHub issues.</span></div>
    <div id="cap1" class="clip cap" data-start="3.24" data-duration="2.39"><span>Which problems actually matter?</span></div>
    <div id="cap2" class="clip cap" data-start="5.63" data-duration="1.79"><span>Reading them all takes days.</span></div>
    <div id="cap3" class="clip cap" data-start="7.42" data-duration="2.48"><span>Asking an AI to summarise is fast,</span></div>
    <div id="cap4" class="clip cap" data-start="9.89" data-duration="1.54"><span>but you can't check its quotes,</span></div>
    <div id="cap5" class="clip cap" data-start="11.43" data-duration="1.60"><span>or its numbers.</span></div>
    <div id="cap6" class="clip cap" data-start="13.55" data-duration="2.52"><span>Groundswell is an agent-native app where you</span></div>
    <div id="cap7" class="clip cap" data-start="16.07" data-duration="2.05"><span>and an agent shape the same board,</span></div>
    <div id="cap8" class="clip cap" data-start="18.11" data-duration="3.32"><span>and every quote and every number can be checked.</span></div>
    <div id="cap9" class="clip cap" data-start="21.91" data-duration="2.70"><span>Built by Favour Olaboye.</span></div>
    <div id="cap10" class="clip cap" data-start="29.05" data-duration="2.09"><span>Point it at a repo and ask.</span></div>
    <div id="cap11" class="clip cap" data-start="31.14" data-duration="1.92"><span>The agent imports every issue,</span></div>
    <div id="cap12" class="clip cap" data-start="33.06" data-duration="1.54"><span>drafts a codebook of problems,</span></div>
    <div id="cap13" class="clip cap" data-start="34.60" data-duration="2.69"><span>and sends four sorters out in parallel.</span></div>
    <div id="cap14" class="clip cap" data-start="37.28" data-duration="1.45"><span>Each card lands with a quote,</span></div>
    <div id="cap15" class="clip cap" data-start="38.73" data-duration="3.05"><span>or stays in Unsorted when nothing fits.</span></div>
    <div id="cap16" class="clip cap" data-start="47.55" data-duration="1.07"><span>Open any card,</span></div>
    <div id="cap17" class="clip cap" data-start="48.62" data-duration="1.66"><span>and its quote is highlighted:</span></div>
    <div id="cap18" class="clip cap" data-start="50.28" data-duration="1.88"><span>the server checked it word for word</span></div>
    <div id="cap19" class="clip cap" data-start="52.16" data-duration="1.41"><span>against the issue.</span></div>
    <div id="cap20" class="clip cap" data-start="53.56" data-duration="0.94"><span>Open a problem,</span></div>
    <div id="cap21" class="clip cap" data-start="54.50" data-duration="3.07"><span>and every number behind its rank comes from SQL:</span></div>
    <div id="cap22" class="clip cap" data-start="57.58" data-duration="1.37"><span>volume, people,</span></div>
    <div id="cap23" class="clip cap" data-start="58.94" data-duration="1.88"><span>engagement and recency.</span></div>
    <div id="cap24" class="clip cap" data-start="60.82" data-duration="1.80"><span>Never from the model.</span></div>
    <div id="cap25" class="clip cap" data-start="64.45" data-duration="1.11"><span>When I disagree,</span></div>
    <div id="cap26" class="clip cap" data-start="65.56" data-duration="1.36"><span>I drag.</span></div>
    <div id="cap27" class="clip cap" data-start="66.92" data-duration="2.26"><span>These Assets and CRM bugs belong with</span></div>
    <div id="cap28" class="clip cap" data-start="69.19" data-duration="1.15"><span>the app bugs.</span></div>
    <div id="cap29" class="clip cap" data-start="70.34" data-duration="1.19"><span>Each move is pinned,</span></div>
    <div id="cap30" class="clip cap" data-start="71.53" data-duration="2.67"><span>and recorded for the agent to learn from.</span></div>
    <div id="cap31" class="clip cap" data-start="77.09" data-duration="3.20"><span>The agent reads my moves and proposes sharper definitions,</span></div>
    <div id="cap32" class="clip cap" data-start="80.29" data-duration="1.28"><span>citing each one.</span></div>
    <div id="cap33" class="clip cap" data-start="81.57" data-duration="2.01"><span>It even renames the problem:</span></div>
    <div id="cap34" class="clip cap" data-start="83.58" data-duration="2.75"><span>bugs in first-party template apps.</span></div>
    <div id="cap35" class="clip cap" data-start="88.35" data-duration="1.19"><span>I apply it.</span></div>
    <div id="cap36" class="clip cap" data-start="89.54" data-duration="2.73"><span>The agent re-sorts the eighty-two related reports,</span></div>
    <div id="cap37" class="clip cap" data-start="92.27" data-duration="2.22"><span>and the twenty-one it moved light up.</span></div>
    <div id="cap38" class="clip cap" data-start="94.49" data-duration="3.69"><span>Undo would put every card back, exactly.</span></div>
    <div id="cap39" class="clip cap" data-start="104.09" data-duration="1.15"><span>For the top problem,</span></div>
    <div id="cap40" class="clip cap" data-start="105.24" data-duration="2.35"><span>I ask for an Insight Brief.</span></div>
    <div id="cap41" class="clip cap" data-start="107.59" data-duration="1.49"><span>The agent writes the problem,</span></div>
    <div id="cap42" class="clip cap" data-start="109.08" data-duration="1.92"><span>its impact and a next step,</span></div>
    <div id="cap43" class="clip cap" data-start="111.00" data-duration="3.19"><span>citing quotes the server checks word for word.</span></div>
    <div id="cap44" class="clip cap" data-start="121.51" data-duration="2.05"><span>Filing previews the issue first,</span></div>
    <div id="cap45" class="clip cap" data-start="123.55" data-duration="1.79"><span>makes me name the repository,</span></div>
    <div id="cap46" class="clip cap" data-start="125.35" data-duration="2.05"><span>and waits for my confirmation.</span></div>
    <div id="cap47" class="clip cap" data-start="127.39" data-duration="2.00"><span>This one goes to a private sandbox,</span></div>
    <div id="cap48" class="clip cap" data-start="129.40" data-duration="2.37"><span>and the brief links back to it.</span></div>
    <div id="cap49" class="clip cap" data-start="136.95" data-duration="2.43"><span>And it keeps working while you're away.</span></div>
    <div id="cap50" class="clip cap" data-start="139.38" data-duration="3.16"><span>A GitHub webhook sorts new issues as they arrive,</span></div>
    <div id="cap51" class="clip cap" data-start="142.54" data-duration="3.03"><span>and a weekly digest reports what changed,</span></div>
    <div id="cap52" class="clip cap" data-start="145.57" data-duration="1.78"><span>through the same actions.</span></div>
    <div id="cap53" class="clip cap" data-start="148.01" data-duration="0.98"><span>Under the hood,</span></div>
    <div id="cap54" class="clip cap" data-start="148.99" data-duration="2.56"><span>the agent only acts through the app's actions:</span></div>
    <div id="cap55" class="clip cap" data-start="151.55" data-duration="1.28"><span>the same ones the board,</span></div>
    <div id="cap56" class="clip cap" data-start="152.83" data-duration="2.05"><span>the chat and MCP use.</span></div>
    <div id="cap57" class="clip cap" data-start="154.88" data-duration="1.62"><span>The server checks every quote,</span></div>
    <div id="cap58" class="clip cap" data-start="156.50" data-duration="1.66"><span>SQL computes every number,</span></div>
    <div id="cap59" class="clip cap" data-start="158.16" data-duration="2.50"><span>and a human approves anything that leaves the app.</span></div>
    <div id="cap60" class="clip cap" data-start="160.66" data-duration="3.20"><span>It all runs on Claude Sonnet 4.6,</span></div>
    <div id="cap61" class="clip cap" data-start="163.86" data-duration="2.11"><span>through Amazon Bedrock.</span></div>
    <div id="cap62" class="clip cap" data-start="166.65" data-duration="2.30"><span>On three hundred and forty real issues:</span></div>
    <div id="cap63" class="clip cap" data-start="168.95" data-duration="1.41"><span>fourteen problems,</span></div>
    <div id="cap64" class="clip cap" data-start="170.36" data-duration="1.66"><span>ninety-six percent sorted,</span></div>
    <div id="cap65" class="clip cap" data-start="172.03" data-duration="2.13"><span>and every card the agent placed carries</span></div>
    <div id="cap66" class="clip cap" data-start="174.16" data-duration="1.84"><span>a verified quote.</span></div>
    <div id="cap67" class="clip cap" data-start="175.99" data-duration="1.19"><span>In the last re-sort,</span></div>
    <div id="cap68" class="clip cap" data-start="177.19" data-duration="2.18"><span>the server rejected ten quotes that weren't</span></div>
    <div id="cap69" class="clip cap" data-start="179.36" data-duration="0.84"><span>word for word.</span></div>
    <div id="cap70" class="clip cap" data-start="180.20" data-duration="3.49"><span>Made-up quotes on the board: zero.</span></div>
    <div id="cap71" class="clip cap" data-start="184.41" data-duration="2.82"><span>Groundswell. Hear what your users keep saying,</span></div>
    <div id="cap72" class="clip cap" data-start="187.22" data-duration="1.94"><span>and ship what matters.</span></div>
  </div>

    window.__timelines = window.__timelines || {};

</template>
